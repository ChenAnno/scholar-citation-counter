<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scholar Rocket</title>
  <style>
    :root {
      color-scheme: light dark;

      --morandi-blue: #9BB7D4;
      --morandi-deep-blue: #4A6B82;

      --bg: #F4F4F2;
      --surface: #FFFFFF;
      --surface-sunken: #F7F7F5;
      --line: rgba(40, 56, 70, 0.09);
      --text: #2E3A43;
      --text-2: #66737C;
      --text-3: #9AA3A9;
      --accent: var(--morandi-deep-blue);
      --accent-soft: var(--morandi-blue);
      --accent-tint: rgba(155, 183, 212, 0.20);
      --on-accent: #FFFFFF;
      --hero-glow: rgba(155, 183, 212, 0.13);
      --count: #509CE7;                        /* headline number: chenanno.github.io blue (#3071B5), lighter and brighter */
      --link-ink: #3071B5;                     /* Homepage / Scholar buttons */
      --link-tint: rgba(48, 113, 181, 0.08);
      --link-tint-hover: rgba(48, 113, 181, 0.14);
      --fresh: #3F7A4C;                        /* new-citation text, darkened morandi green */
      --fresh-tint: rgba(143, 186, 149, 0.22);    /* morandi green #8FBA95 */
      --fresh-ring: rgba(143, 186, 149, 0.60);
      --warn: #9A6420;
      --warn-tint: rgba(194, 138, 61, 0.13);
            --danger: #B4545A;
      --shadow: 0 1px 2px rgba(40, 56, 70, 0.05), 0 6px 18px rgba(40, 56, 70, 0.06);
      --sheet-shadow: 0 -6px 24px rgba(40, 56, 70, 0.12);
      --scrim: rgba(30, 40, 48, 0.14);
      --ease-sheet: cubic-bezier(0.16, 1, 0.3, 1);

      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", sans-serif;
      --font-serif: "New York", "Iowan Old Style", Georgia, "Songti SC", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181B;
        --surface: #212428;
        --surface-sunken: #1A1D20;
        --line: rgba(255, 255, 255, 0.08);
        --text: #E7EAEC;
        --text-2: #A2ACB3;
        --text-3: #6E777E;
        --accent: #A9C3DD;
        --accent-soft: #6F8FAB;
        --accent-tint: rgba(155, 183, 212, 0.14);
        --on-accent: #16202A;
        --hero-glow: rgba(155, 183, 212, 0.07);
        --count: #8CBFF3;                      /* same hue, lightened for the dark card */
        --link-ink: #8DB8E6;
        --link-tint: rgba(126, 172, 221, 0.12);
        --link-tint-hover: rgba(126, 172, 221, 0.20);
        --fresh: #A6D1AC;
        --fresh-tint: rgba(143, 186, 149, 0.16);
        --fresh-ring: rgba(143, 186, 149, 0.40);
        --warn: #E0B070;
        --warn-tint: rgba(224, 176, 112, 0.12);
        --danger: #E39A9E;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.30), 0 6px 18px rgba(0, 0, 0, 0.22);
        --sheet-shadow: 0 -6px 24px rgba(0, 0, 0, 0.40);
        --scrim: rgba(0, 0, 0, 0.40);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; }
    body {
      width: 300px;
      height: 330px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.4 var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button { font: inherit; color: inherit; }
    svg { display: block; flex: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-sm { width: 11px; height: 11px; stroke-width: 2; }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }
    .icon-btn:hover { background: var(--accent-tint); color: var(--accent); }

    /* App container: clips the slide-up sheets so they stay in bounds. */
    .app { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* ========================================= */
    /* Main view                                  */
    /* ========================================= */
    .main {
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform-origin: 50% 0;
      transition: transform 0.45s var(--ease-sheet), opacity 0.45s;
    }
    .app.has-sheet .main { transform: scale(0.94); opacity: 0.6; }

    .card {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 16px 14px;
      background: linear-gradient(180deg, var(--hero-glow), transparent 55%), var(--surface);
    }
    .hero-settings { position: absolute; top: 8px; right: 8px; }
    .hero-settings:hover .icon { transform: rotate(45deg); }
    .hero-settings .icon { transition: transform 0.3s; }

    .profile-name {
      max-width: 188px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 600 15px/1.35 var(--font-serif);
      letter-spacing: 0.2px;
      color: var(--accent);
    }

    .metric { margin-top: 10px; text-align: center; }
    .metric-value { position: relative; display: inline-block; }
    .count {
      font: 250 56px/1 var(--font-display);
      letter-spacing: -1.5px;
      color: var(--count);
    }
    .count.is-long { font-size: 46px; }
    .count.is-empty { color: var(--text-3); }
    /* Ticker-style increase beside the total; absolutely placed so the total stays centered. */
    .delta {
      position: absolute;
      left: 100%;
      top: 2px;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--fresh-tint);
      color: var(--fresh);
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .metric.is-crowded .metric-value { display: flex; flex-direction: column; align-items: center; }
    .metric.is-crowded .delta { position: static; margin: 6px 0 0; }
    .metric-label {
      margin-top: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .hero-links { display: flex; justify-content: center; gap: 8px; width: 100%; margin-top: 16px; }
    .link-btn {
      flex: 0 1 112px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--link-tint);
      color: var(--link-ink);
      font-size: 11.5px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .link-btn:hover { background: var(--link-tint-hover); transform: translateY(-1px); }
    .link-btn:active { transform: none; }
    .link-btn .icon { width: 14px; height: 14px; }

    /* New citations entry */
    .new-row {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 10px 11px 11px;
      border: 0;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .new-row:hover { transform: translateY(-1px); }
    .new-row:active { transform: none; }
    .new-row[data-state="fresh"] { box-shadow: var(--shadow), inset 0 0 0 1px var(--fresh-ring); }
    .new-row[data-state="waiting"] { cursor: default; }
    .new-row[data-state="waiting"]:hover { transform: none; }

    .new-icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent-tint);
      color: var(--accent);
    }
    .new-icon .icon { display: none; }
    .new-row[data-state="fresh"] .i-fresh,
    .new-row[data-state="quiet"] .i-quiet,
    .new-row[data-state="waiting"] .i-waiting,
    .new-row[data-state="setup"] .i-setup { display: block; }
    .new-row[data-state="fresh"] .new-icon { background: var(--fresh-tint); color: var(--fresh); }
    .new-row[data-state="waiting"] .new-icon { color: var(--text-3); }

    .new-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .new-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .new-sub {
      font-size: 11px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .new-row[data-state="fresh"] .new-sub { color: var(--fresh); font-weight: 500; }
    .chevron { color: var(--text-3); }
    .new-row[data-state="waiting"] .chevron { visibility: hidden; }

    /* Footer: the sync button doubles as the sync status; full width like the cards above */
    .footer { display: flex; gap: 8px; }
    .footer-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 17px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text-2);
      font-size: 11.5px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .footer-pill:hover { background: var(--accent-tint); color: var(--accent); transform: translateY(-1px); }
    .footer-pill:active { transform: none; }
    .footer-pill .icon { width: 14px; height: 14px; }
    .footer-pill.is-warn { background: var(--warn-tint); color: var(--warn); box-shadow: none; }
    .refresh { flex: 1; }
    .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .refresh.is-cooling .icon { opacity: 0.5; }
    .refresh.is-spinning { color: var(--accent); }
    .refresh.is-spinning .icon { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========================================= */
    /* Slide-up sheets (iOS style)                */
    /* ========================================= */
    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .app.has-sheet .scrim { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      top: 14px;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      box-shadow: var(--sheet-shadow);
      /* Sits below the popup until opened; hidden so it cannot take focus. */
      visibility: hidden;
      transform: translateY(102%);
      transition: transform 0.45s var(--ease-sheet), visibility 0s 0.45s;
    }
    .sheet.is-open {
      visibility: visible;
      transform: none;
      transition: transform 0.45s var(--ease-sheet), visibility 0s;
    }
    /* Grabber */
    .sheet::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 50%;
      width: 32px;
      height: 4px;
      margin-left: -16px;
      border-radius: 2px;
      background: var(--text-3);
      opacity: 0.35;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 18px 10px 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-heading { flex: 1; min-width: 0; }
    .sheet-title { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.1px; }
    .sheet-sub { margin: 2px 0 0; font-size: 11px; color: var(--text-2); text-wrap: balance; }
    .sheet-close { margin-top: -3px; }
    .sheet-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    /* New citations list */
    .paper-list { padding: 6px 6px 14px; }
    .paper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: background 0.15s;
    }
    a.paper:hover { background: var(--surface-sunken); }
    .paper-delta {
      flex: none;
      min-width: 38px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--fresh-tint);
      color: var(--fresh);
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .paper-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .paper-title {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper-meta { font-size: 10.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .paper-go { margin-top: 3px; color: var(--text-3); opacity: 0; transition: opacity 0.15s; }
    a.paper:hover .paper-go { opacity: 1; }
    .list-note { margin: 10px 12px 0; font-size: 10.5px; color: var(--text-2); text-align: center; text-wrap: balance; }

    .empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 30px 18px;
      text-align: center;
    }
    .empty-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 8px;
      padding: 12px;
      border-radius: 50%;
      background: var(--accent-tint);
      color: var(--accent);
    }
    .empty-title { margin: 0; font-size: 13px; font-weight: 600; }
    .empty-sub { margin: 0; font-size: 11px; line-height: 1.5; color: var(--text-2); text-wrap: balance; }

    /* Settings form */
    .settings-form { padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 9px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { font-size: 11px; font-weight: 600; color: var(--text); }
    .field-label .hint { font-weight: 400; color: var(--text-2); }
    .field-label .hint.is-error { color: var(--danger); }
    .field input {
      width: 100%;
      padding: 6px 10px;
      font: 12px var(--font-ui);
      color: var(--text);
      background: var(--surface-sunken);
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field input::placeholder { color: var(--text-3); }
    .field input:focus {
      border-color: var(--accent-soft);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--accent-tint);
    }
    .field input[aria-invalid="true"] { border-color: var(--danger); }

    .primary-btn {
      margin-top: 2px;
      padding: 9px 0;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
    }
    .primary-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .primary-btn:active { transform: none; }
    .primary-btn.is-done { background: var(--fresh); }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">

    <!-- Main view -->
    <main id="main" class="main">
      <section class="hero card">
        <button id="open-settings" class="icon-btn hero-settings" type="button" title="Settings" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <span id="profile-name" class="profile-name">Scholar Rocket</span>

        <div id="metric" class="metric">
          <div class="metric-value">
            <span id="citation-count" class="count">—</span>
            <span id="citation-delta" class="delta" hidden></span>
          </div>
          <div class="metric-label">Citations</div>
        </div>

        <div id="hero-links" class="hero-links">
          <a id="home-link" class="link-btn" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            Homepage
          </a>
          <a id="scholar-link" class="link-btn" target="_blank" rel="noopener" title="Google Scholar profile">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
            Scholar
          </a>
        </div>
      </section>

      <button id="open-new" class="new-row card" type="button" data-state="waiting">
        <span class="new-icon" aria-hidden="true">
          <svg class="icon i-fresh" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          <svg class="icon i-quiet" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          <svg class="icon i-waiting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <svg class="icon i-setup" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </span>
        <span class="new-text">
          <span id="new-title" class="new-title">New citations</span>
          <span id="new-sub" class="new-sub"></span>
        </span>
        <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <footer class="footer">
        <a id="verify-link" class="footer-pill is-warn" target="_blank" rel="noopener" hidden
           title="Google Scholar asked for a CAPTCHA. Solve it, then retry.">
          Verify
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
        </a>
        <button id="refresh" class="footer-pill refresh" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          <span id="status" class="status" role="status"></span>
        </button>
      </footer>
    </main>

    <div id="scrim" class="scrim"></div>

    <!-- New citations sheet -->
    <section id="new-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="new-sheet-title">
      <header class="sheet-header">
        <div class="sheet-heading">
          <h2 id="new-sheet-title" class="sheet-title">New citations</h2>
          <p id="new-sheet-sub" class="sheet-sub"></p>
        </div>
        <button class="icon-btn sheet-close" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div id="paper-list" class="sheet-body paper-list">
        <!-- Paper list injected dynamically. -->
      </div>
    </section>

    <!-- Settings sheet -->
    <section id="settings-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="sheet-header">
        <div class="sheet-heading">
          <h2 id="settings-title" class="sheet-title">Settings</h2>
          <p id="settings-sub" class="sheet-sub"></p>
        </div>
        <button class="icon-btn sheet-close" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <form id="settings-form" class="sheet-body settings-form" novalidate autocomplete="off">
        <label class="field">
          <span class="field-label">Google Scholar profile <span id="scholar-hint" class="hint" role="status">· URL or user ID</span></span>
          <input id="input-scholar" type="text" spellcheck="false" aria-describedby="scholar-hint" placeholder="https://scholar.google.com/citations?user=…">
        </label>
        <label class="field">
          <span class="field-label">Display name <span class="hint">· optional</span></span>
          <input id="input-name" type="text" placeholder="Your name">
        </label>
        <label class="field">
          <span class="field-label">Homepage <span class="hint">· optional</span></span>
          <input id="input-home" type="text" spellcheck="false" placeholder="https://your-site.com">
        </label>
        <button id="save-settings" type="submit" class="primary-btn">Save</button>
      </form>
    </section>

  </div>
