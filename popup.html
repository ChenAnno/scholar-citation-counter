<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --morandi-blue: #9BB7D4;
      --morandi-deep-blue: #4A6B82;
      --morandi-grey: #A1A9AD;
      --morandi-green: #8FBA95;
      --bg-color: #F4F4F2;
    }

    body {
      font-family: "SF Pro Display", "-apple-system", ".SFNSDisplay", "Helvetica Neue", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 220px;
      height: 270px;
      margin: 0;
    }

    /* App container: clips the slide-up drawers so they stay in bounds. */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle settings (gear) button, top-right corner. */
    #open-settings {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      color: var(--morandi-grey);
      opacity: 0.55;
      cursor: pointer;
      z-index: 5;
      transition: opacity 0.2s, transform 0.2s;
    }
    #open-settings:hover { opacity: 1; transform: rotate(45deg); }

    /* Main card */
    .card {
      background: white;
      width: 190px;
      height: 240px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px rgba(0,0,0,0.04);
      padding: 0 10px;
      box-sizing: border-box;
    }

    .home-link {
      font-family: "New York", "Georgia", serif;
      font-size: 13px;
      font-weight: 600;
      font-style: normal;
      color: var(--morandi-deep-blue);
      letter-spacing: 0.5px;
      text-decoration: none;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(74, 107, 130, 0.15);
      padding-bottom: 2px;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .home-link:hover { opacity: 0.8; border-bottom-color: var(--morandi-deep-blue); }

    #citation-count {
      font-family: "SF Pro Display", -apple-system, sans-serif;
      font-size: 58px;
      font-weight: 100;
      color: var(--morandi-blue);
      line-height: 0.95;
      margin-top: 4px;
      letter-spacing: -1.5px;
    }

    .scholar-link {
      font-size: 11px;
      font-weight: 400;
      color: var(--morandi-blue);
      text-decoration: none;
      margin-top: 12px;
      letter-spacing: 0.3px;
      border-bottom: 1px solid rgba(155, 183, 212, 0.2);
      padding-bottom: 1px;
    }

    #status {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 9px;
      color: #CCC;
      margin-top: 14px;
      height: 12px;
      letter-spacing: 0.5px;
    }

    #refresh {
      font-family: "SF Pro Text", -apple-system, sans-serif;
      margin-top: 14px;
      background: var(--morandi-blue);
      color: white;
      border: none;
      width: 124px;
      padding: 8px 0;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(155, 183, 212, 0.2);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    #refresh:hover { background: #8AA7C4; transform: translateY(-1px); }
    #refresh:active { transform: translateY(0); }

    #view-new {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 10px;
      font-weight: 400;
      color: var(--morandi-green);
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 16px;
      padding: 0;
      padding-bottom: 1px;
      border-bottom: 1px solid rgba(143, 186, 149, 0.2);
      transition: opacity 0.2s, border-color 0.2s;
    }
    #view-new:hover { opacity: 0.8; border-bottom-color: var(--morandi-green); }

    /* ========================================= */
    /* Slide-up overlays (iOS-style drawers)      */
    /* ========================================= */
    .overlay-view {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px); /* frosted-glass background */
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      z-index: 10;

      /* Sits below the screen by default, slides up when active. */
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay-view.active { transform: translateY(0); }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px 12px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .overlay-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--morandi-deep-blue);
      letter-spacing: 0.3px;
    }
    .close-overlay {
      background: none; border: none; padding: 0;
      font-size: 18px; color: var(--morandi-grey);
      cursor: pointer; line-height: 1; transition: color 0.2s;
    }
    .close-overlay:hover { color: #555; }

    /* List area with elegant scrolling. */
    #paper-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      box-sizing: border-box;
    }
    /* Hide scrollbar but keep scrolling (Mac aesthetic). */
    #paper-list::-webkit-scrollbar { display: none; }

    .paper-item {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed rgba(0,0,0,0.06);
    }
    .paper-item:last-child { border-bottom: none; }

    .paper-badge {
      display: inline-block;
      background: var(--morandi-green);
      color: white;
      font-size: 9px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .paper-title {
      font-size: 11px;
      font-weight: 400;
      color: #555;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty-state {
      text-align: center;
      color: var(--morandi-grey);
      font-size: 11px;
      margin-top: 50px;
      font-style: italic;
    }

    /* ========================================= */
    /* Settings form                              */
    /* ========================================= */
    #settings-form {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      box-sizing: border-box;
    }
    #settings-form::-webkit-scrollbar { display: none; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--morandi-deep-blue);
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    .field .hint {
      font-weight: 400;
      color: var(--morandi-grey);
    }
    .field input {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 11px;
      color: #555;
      background: #FAFAF9;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      padding: 7px 9px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input:focus {
      border-color: var(--morandi-blue);
      background: white;
    }

    #save-settings {
      width: 100%;
      margin-top: 4px;
      background: var(--morandi-deep-blue);
      color: white;
      border: none;
      padding: 9px 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    #save-settings:hover { background: #3C5A6E; transform: translateY(-1px); }
    #save-settings:active { transform: translateY(0); }

    #settings-status {
      text-align: center;
      font-size: 9px;
      color: var(--morandi-green);
      height: 12px;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <!-- Container clips the slide range. -->
  <div id="app-container">

    <button id="open-settings" title="Settings">&#9881;</button>

    <!-- Main view -->
    <div class="card">
      <a href="#" target="_blank" class="home-link" id="home-link">My Profile</a>
      <div id="citation-count">--</div>
      <a href="#" target="_blank" class="scholar-link" id="scholar-link">My Scholar</a>
      <div id="status">...</div>
      <button id="refresh">Sync Now</button>
      <button id="view-new">New Papers</button>
    </div>

    <!-- New papers drawer -->
    <div id="overlay-view" class="overlay-view">
      <div class="overlay-header">
        <span class="overlay-title">Recent Citations</span>
        <button id="close-overlay" class="close-overlay">&times;</button>
      </div>
      <div id="paper-list">
        <!-- Paper list injected dynamically. -->
      </div>
    </div>

    <!-- Settings drawer -->
    <div id="settings-view" class="overlay-view">
      <div class="overlay-header">
        <span class="overlay-title">Settings</span>
        <button id="close-settings" class="close-overlay">&times;</button>
      </div>
      <div id="settings-form">
        <div class="field">
          <label for="input-scholar">Google Scholar profile <span class="hint">(URL or user ID)</span></label>
          <input id="input-scholar" type="text" placeholder="https://scholar.google.com/citations?user=XXXX">
        </div>
        <div class="field">
          <label for="input-name">Display name <span class="hint">(optional)</span></label>
          <input id="input-name" type="text" placeholder="Your name">
        </div>
        <div class="field">
          <label for="input-home">Homepage URL <span class="hint">(optional)</span></label>
          <input id="input-home" type="text" placeholder="https://your-site.com">
        </div>
        <button id="save-settings">Save</button>
        <div id="settings-status"></div>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
